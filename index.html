<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a12"><title>WINE AI — Think Beyond</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080a12;color:#f5f7ff;font-family:Cairo,sans-serif}body{min-height:100svh;display:grid;place-items:center;padding:22px;overflow:hidden;position:relative;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:56px 56px}body:before,body:after{content:"";position:fixed;width:460px;height:460px;border-radius:50%;filter:blur(120px);opacity:.22;pointer-events:none}body:before{background:#6554ff;top:-260px;right:-170px}body:after{background:#19b8c9;bottom:-300px;left:-160px}
.panel{width:min(100%,590px);text-align:center;position:relative;padding:52px 32px 38px;border:1px solid #ffffff1c;border-radius:30px;background:linear-gradient(145deg,#151a2aee,#0d111dee);box-shadow:0 30px 100px #0009,inset 0 1px #ffffff12;backdrop-filter:blur(22px)}.brand{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:24px}.symbol{width:58px;height:58px;filter:drop-shadow(0 0 24px #8b7bff55)}.wordmark{font:300 clamp(46px,12vw,70px)/1 Manrope,sans-serif;letter-spacing:.13em;padding-left:.13em;background:linear-gradient(110deg,#fff 15%,#aab6ff 55%,#6ce2e5);color:transparent;background-clip:text}.tag{display:inline-flex;align-items:center;gap:9px;padding:8px 14px;border:1px solid #8e85ff44;border-radius:99px;color:#c8c5ff;font:600 10px Manrope,sans-serif;letter-spacing:2px;background:#8175ff12}.dot{width:7px;height:7px;border-radius:50%;background:#8b7bff;box-shadow:0 0 12px #8b7bff;animation:pulse 1.8s infinite}h1{font-size:clamp(23px,5vw,33px);font-weight:800;margin:23px 0 10px}h1 span{background:linear-gradient(90deg,#a99fff,#69dce0);color:transparent;background-clip:text}p{color:#a7afc4;font-size:14px;line-height:2;margin:0 auto;max-width:430px}.features{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:25px auto 0}.features span{border:1px solid #ffffff18;border-radius:10px;padding:8px 12px;color:#c5cbe0;font-size:10px;background:#ffffff08}.line{height:1px;background:linear-gradient(90deg,transparent,#8b7bff77,#39cbd077,transparent);margin:30px 0 19px}.foot{font:600 9px Manrope,sans-serif;letter-spacing:2.3px;color:#69738d}.owner-toggle{margin-top:22px;background:#ffffff09;border:1px solid #ffffff24;color:#b9c1d8;border-radius:12px;padding:10px 19px;font:600 11px Cairo;cursor:pointer;transition:.2s}.owner-toggle:hover{border-color:#a49aff;color:#fff;background:#8175ff18}.owner-form{display:none;margin:15px auto 0;max-width:320px;text-align:right}.owner-form.open{display:block}.owner-form label{display:block;color:#b8c0d6;font-size:12px;margin-bottom:8px}.owner-form input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid #ffffff25;background:#090d18;color:#fff;font:14px Cairo;outline:none}.owner-form input:focus{border-color:#9287ff;box-shadow:0 0 0 3px #8175ff1c}.owner-form button{width:100%;margin-top:9px;padding:12px;border:0;border-radius:11px;background:linear-gradient(100deg,#8d7cff,#4bbfca);color:#080a12;font:800 13px Cairo;cursor:pointer}.error{min-height:22px;margin-top:7px;color:#ff9eae;font-size:12px;text-align:center}@keyframes pulse{50%{opacity:.35;box-shadow:0 0 3px #8b7bff}}@media(max-width:480px){.panel{padding:40px 19px 28px;border-radius:24px}.symbol{width:48px;height:48px}.features{gap:6px}}
</style></head><body><main class="panel" role="status" aria-live="polite"><div class="brand"><svg class="symbol" viewBox="0 0 64 64" fill="none" aria-label="WINE symbol"><path d="M8 12L21 52L32 25L43 52L56 12" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="g" x1="8" y1="12" x2="56" y2="52"><stop stop-color="#B7ACFF"/><stop offset="1" stop-color="#5CE0E2"/></linearGradient></defs></svg><div class="wordmark">WINE</div></div><div class="tag"><span class="dot"></span> A NEW ERA OF INTELLIGENCE</div><h1>WINE AI <span>يتطوّر من جديد</span></h1><p>نعيد تشكيل التجربة لتكون أسرع، أذكى، وأكثر قدرة على تحويل أفكارك إلى إنجازات.</p><div class="features"><span>ذكاء يفهم السياق</span><span>مساحة عمل للمبدعين</span><span>تجربة أكثر سلاسة</span></div><div class="line"></div><div class="foot">WINE · THINK BEYOND</div><button class="owner-toggle" id="ownerToggle" type="button">دخول المالك</button><form class="owner-form" id="ownerForm"><label for="ownerPassword">كلمة مرور المالك</label><input id="ownerPassword" type="password" autocomplete="current-password" required><button type="submit" id="ownerSubmit">فتح WINE AI</button><div class="error" id="ownerError" role="alert"></div></form></main>
<script>
const toggle=document.getElementById('ownerToggle'),form=document.getElementById('ownerForm'),error=document.getElementById('ownerError'),submit=document.getElementById('ownerSubmit');toggle.addEventListener('click',()=>{form.classList.toggle('open');if(form.classList.contains('open'))document.getElementById('ownerPassword').focus()});form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';submit.disabled=true;submit.textContent='جارٍ التحقق...';try{const response=await fetch('/api/owner',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('ownerPassword').value})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'تعذر تسجيل الدخول.');location.href='/api/owner'}catch(err){error.textContent=err.message||'حدث خطأ، حاول مرة أخرى.'}finally{submit.disabled=false;submit.textContent='فتح WINE AI'}});
</script></body></html>
